<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)" />
    <meta
      name="description"
      content="Ripple — realtime chat with presence, typing indicators, reactions and more. Conversations that flow."
    />
    <link rel="canonical" href="https://ripple-chatz.vercel.app/" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Ripple" />
    <meta name="application-name" content="Ripple" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Ripple" />
    <meta property="og:title" content="Ripple — Conversations that flow." />
    <meta
      property="og:description"
      content="Realtime chat with presence, typing indicators, reactions and more."
    />
    <meta property="og:image" content="https://ripple-chatz.vercel.app/icon.svg" />
    <meta property="og:url" content="https://ripple-chatz.vercel.app/" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Ripple — Conversations that flow." />
    <meta
      name="twitter:description"
      content="Realtime chat with presence, typing indicators, reactions and more."
    />
    <meta name="twitter:image" content="https://ripple-chatz.vercel.app/icon.svg" />

    <title>Ripple — Conversations that flow.</title>
    <script>
      // Apply persisted theme before first paint to avoid a flash.
      ;(function () {
        try {
          var stored = localStorage.getItem('ripple-theme')
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches
          var dark = stored ? stored === 'dark' : prefersDark
          document.documentElement.classList.toggle('dark', dark)
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
